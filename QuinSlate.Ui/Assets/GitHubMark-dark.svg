<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 20.2 67 75.8" width="67" height="75.8">
  <!-- Dark-theme GitHub mark: the octocat on its own, no disc.
       GitHub's own mark cannot be used as-is here — it is drawn as a filled circle with the cat
       knocked OUT of it, so it always reads as a circle whatever colour it is given. This path is
       that mark's contour with the circle arcs dropped, leaving the cat as a positive shape closed
       across the bottom. The viewBox is cropped to the cat's ink so it fills whatever box the
       About footer gives it instead of floating inside the vacated disc.
       The colour is baked in because Image ignores Foreground (see ThemedImageAsset); the fill
       matches TextFillColorTertiary for this theme (#87FFFFFF) so the mark carries the same weight
       as the link text beside it. -->
